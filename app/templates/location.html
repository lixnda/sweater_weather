<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.tailwindcss.com"></script>
        <style type="text/tailwindcss">
                @layer utilities {
                    .content-auto {
                        content-visibility: auto;
                    }
                }
        </style>
    </head>
    
    <body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
        <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md space-y-6">

            <form action="/location" method="POST" class="space-y-4">
                <div class="space-y-2">
                    <label for="place" class="text-gray-600 text-sm font-medium">
                    Enter a City
                    </label>
                    <input type="text" name="place" id="place" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 transition" placeholder="e.g., West Lafayette"/>
                </div>

                <button type="submit" class="w-full py-2.5 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700 transition">
                    Submit
                </button>
                
            </form>
        </div>
    </body>
</html>
